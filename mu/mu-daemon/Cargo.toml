[package]
name = "mu-daemon"
version.workspace = true
edition.workspace = true

[dependencies]
mu-common = { path = "../mu-common" }
mu-core = { path = "../mu-core" }
mu-log = { path = "../mu-log" }
mu-gate = { path = "../mu-gate" }
mu-runtime = { path = "../mu-runtime" }
mu-connect = { path = "../mu-connect" }
mu-vault = { path = "../mu-vault" }
mu-human = { path = "../mu-human" }
mu-policy = { path = "../mu-policy" }
mu-license = { path = "../mu-license" }
sha2 = "=0.10.8"
serde_json = "1"

[features]
# P11e: the anchor service — Solana anchors paid from the capsules' sub-wallets of the vault.
ksg = ["mu-connect/ksg", "mu-connect/http", "mu-vault/ksg"]
# softvault — ТОЛЬКО для тестов/CI. В release защёлка даёт compile_error.
softvault = ["mu-vault/softvault"]

#[cfg(all(not(debug_assertions), feature = "softvault"))]
#compile_error!("softvault запрещён в release");
