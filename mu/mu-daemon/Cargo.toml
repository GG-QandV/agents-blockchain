[package]
name = "mu-daemon"
version.workspace = true
edition.workspace = true

[dependencies]
mu-common = { path = "../mu-common" }
mu-core = { path = "../mu-core" }
mu-log = { path = "../mu-log" }
mu-gate = { path = "../mu-gate" }
mu-runtime = { path = "../mu-runtime" }
mu-connect = { path = "../mu-connect" }
mu-vault = { path = "../mu-vault" }
mu-human = { path = "../mu-human" }
mu-policy = { path = "../mu-policy" }
mu-license = { path = "../mu-license" }
sha2 = "=0.10.8"
p256 = { version = "=0.13.2", features = ["ecdsa"] }
zeroize = "=1.7.0"

[features]
# softvault — the file-backed software vault (keys read from $MU_HOME). Hardware backends: not implemented yet.
softvault = ["mu-vault/softvault"]

