[package]
name = "ksg-smoke"
description = "μ Gate KSG smoke: pay a keysingate issuer's 402 answer through the whole pipeline (test wallet, Base Sepolia)"
version.workspace = true
edition = "2021"
publish = false

[dependencies]
mu-common = { path = "../mu-common" }
mu-connect = { path = "../mu-connect", features = ["softvault"] }
mu-human = { path = "../mu-human" }
mu-log = { path = "../mu-log" }
mu-policy = { path = "../mu-policy" }
mu-runtime = { path = "../mu-runtime" }
mu-vault = { path = "../mu-vault", features = ["softvault"] }
p256 = { version = "=0.13.2", features = ["ecdsa"] }
serde_json = "1"
tempfile = "=3.10.1"
