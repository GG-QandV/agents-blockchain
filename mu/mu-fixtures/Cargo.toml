[package]
name = "mu-fixtures"
version.workspace = true
edition.workspace = true

# DEV-ONLY: генератор тестовых артефактов на SoftVault. НЕ линкуется в демон.
[dependencies]
mu-common = { path = "../mu-common" }
mu-core = { path = "../mu-core" }
mu-log = { path = "../mu-log" }
mu-policy = { path = "../mu-policy" }
mu-vault = { path = "../mu-vault", features = ["softvault"] }
ed25519-dalek = "=2.1.1"
p256 = { version = "=0.13.2", features = ["ecdsa"] }

[[bin]]
name = "mu-fixtures"
path = "src/main.rs"

[dev-dependencies]
p256 = { version = "=0.13.2", features = ["ecdsa"] }
tempfile = "=3.10.1"
