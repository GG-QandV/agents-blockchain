# ВНЕ workspace (см. [workspace] ниже): Tauri 2 требует Rust 1.77+ и системные
# webkit2gtk/WebView2 — собирается на машине разработчика, не в CI ядра.
[package]
name = "composer-tauri"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
mu-common = { path = "../mu-common" }
mu-policy = { path = "../mu-policy" }
composer-core = { path = "../composer-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
