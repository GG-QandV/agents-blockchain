[package]
name = "mu-connect"
version.workspace = true
edition.workspace = true

[dependencies]
mu-common = { path = "../mu-common" }
mu-vault = { path = "../mu-vault" }
sha2 = "=0.10.8"
blake2 = "=0.10.6"
sha3 = "=0.10.8"
base64 = "=0.21.7"

[features]
default = []
softvault = ["mu-vault/softvault"]

[dev-dependencies]
p256 = { version = "=0.13.2", features = ["ecdsa"] }
mu-vault = { path = "../mu-vault", features = ["softvault"] }
