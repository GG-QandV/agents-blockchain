[package]
name = "mu-connect"
version.workspace = true
edition.workspace = true

[dependencies]
mu-common = { path = "../mu-common" }
mu-vault = { path = "../mu-vault" }
sha2 = "=0.10.8"
blake2 = "=0.10.6"
sha3 = "=0.10.8"
base64 = "=0.21.7"
k256 = { version = "=0.13.3", features = ["ecdsa"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
serde_json = "1"
# P11g: the anchor template is read as TOML, the same crate and pin as `mu-policy`.
toml = "=0.5.11"
serde = { version = "=1.0.217", features = ["derive"] }
# P11d: the real transport of a Solana node (HTTP POST, JSON-RPC). Optional: the connector itself opens no socket.
ureq = { version = "2", optional = true }

[features]
default = []
# P11d: `solana_rpc::http_post`, the HTTP transport (ureq). The traits and the node client need none.
http = ["dep:ureq"]
softvault = ["mu-vault/softvault"]
# μ Gate KSG edition: Solana anchors signed by the vault's Ed25519 sub-wallets.
ksg = ["mu-vault/ksg"]

[dev-dependencies]
ed25519-dalek = { version = "=2.1.1", default-features = false }
p256 = { version = "=0.13.2", features = ["ecdsa"] }
mu-vault = { path = "../mu-vault", features = ["softvault"] }
